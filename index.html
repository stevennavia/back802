<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>back802</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    #reticle {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 6px; height: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
    }
    #reticle.active {
      border-color: rgba(255,255,255,0.7);
      width: 10px; height: 10px;
    }
    #context-text {
      position: absolute; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-family: 'Courier New', monospace;
      font-size: 13px; text-align: center;
      pointer-events: none; opacity: 0;
      transition: opacity 0.2s;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    .message {
      position: absolute; top: 38%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.75);
      font-family: 'Courier New', monospace;
      font-size: 16px; text-align: center;
      pointer-events: none; opacity: 0;
      transition: opacity 0.6s;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
    .message.error { color: rgba(255,100,100,0.85); }
    .message.success { color: rgba(100,255,100,0.85); }
    #hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.15);
      font-family: 'Courier New', monospace;
      font-size: 11px; text-align: center;
    }
    #timer {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-family: 'Courier New', monospace;
      font-size: 28px; letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
      opacity: 0; transition: opacity 0.5s;
    }
    #timer.visible { opacity: 1; }
    #timer.warning { color: rgba(255,200,60,0.9); }
    #timer.danger { color: rgba(255,80,80,0.9); }
    #gameover {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      justify-content: center; align-items: center;
      z-index: 30; pointer-events: auto;
      background: rgba(0,0,0,0.85);
    }
    #gameover.open { display: flex; }
    #gameover-text {
      color: #cc3333; font-family: 'Courier New', monospace;
      font-size: 48px; letter-spacing: 8px;
      text-shadow: 0 0 20px rgba(200,0,0,0.5);
    }
    #win-overlay {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      justify-content: center; align-items: center;
      z-index: 40; pointer-events: auto;
      background: rgba(255,255,255,0);
      transition: background 2s;
    }
    #win-overlay.open { display: flex; }
    #win-text {
      color: #999; font-family: 'Courier New', monospace;
      font-size: 52px; letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(0,0,0,0.2);
      opacity: 0; transition: opacity 1s;
    }
    #dizzy-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 15;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
      opacity: 0; transition: opacity 0.1s;
    }
    #cover {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 50; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      transition: opacity 0.6s; pointer-events: auto;
    }
    #cover.hidden { opacity: 0; pointer-events: none; }
    #cover-bg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('/portada.png') center/cover no-repeat;
    }
    #cover-btn {
      position: relative; z-index: 1; margin-top: 75vh;
      background: rgba(0,0,0,0.5); color: #ddd;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 12px 40px;
      font-family: 'Courier New', monospace; font-size: 18px;
      cursor: pointer; pointer-events: auto; letter-spacing: 2px;
      transition: background 0.3s;
    }
    #cover-btn:hover { background: rgba(0,0,0,0.7); }
    #tutorial {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-family: 'Courier New', monospace;
      font-size: 13px; text-align: center;
      z-index: 12; pointer-events: none;
      transition: opacity 0.8s;
    }
    #touch-interact {
      display: none; position: fixed; bottom: 40px; right: 30px;
      width: 70px; height: 70px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7);
      font-family: 'Courier New', monospace; font-size: 20px;
      z-index: 60; pointer-events: auto; cursor: pointer;
      touch-action: manipulation;
    }
    @media (pointer: coarse) {
      #touch-interact { display: block; }
      #reticle, #context-text { display: none; }
    }
    @keyframes wiggle {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      20% { transform: translateX(-50%) rotate(-6deg); }
      40% { transform: translateX(-50%) rotate(6deg); }
      60% { transform: translateX(-50%) rotate(-4deg); }
      80% { transform: translateX(-50%) rotate(4deg); }
    }
    #timer.wiggle { animation: wiggle 0.5s ease-in-out 3; }
    @media (max-width: 600px) {
      #timer { font-size: 5vw; }
      #npc-text { font-size: 4.5vw; min-height: 4em; }
      #npc-portrait { width: 120px; height: 120px; }
      #npc-dialog-box { flex-direction: column; align-items: center; max-width: 92%; }
      #npc-content { align-items: center; }
      #npc-name { text-align: center; }
      #win-text { font-size: 8vw; }
      #cover-btn { font-size: 4vw; padding: 10px 30px; margin-top: 80vh; }
    }
    #npc-dialog {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      justify-content: center; align-items: center;
      z-index: 20; pointer-events: auto;
    }
    #npc-dialog.open { display: flex; }
    #npc-dialog-bg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
    }
    #npc-dialog-box {
      position: relative;
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 12px; padding: 24px;
      max-width: 500px; width: 90%;
      display: flex; flex-direction: row; align-items: flex-start;
      gap: 20px;
    }
    #npc-portrait {
      width: 160px; height: 160px;
      object-fit: cover; border: 2px solid #444;
      flex-shrink: 0;
    }
    #npc-content {
      display: flex; flex-direction: column; gap: 16px;
      flex: 1; align-items: flex-start;
    }
    #npc-text {
      color: #ddd; font-family: 'Courier New', monospace;
      font-size: 18px; line-height: 1.6; text-align: left;
      margin: 0; min-height: 3em;
    }
    #npc-name {
      color: #aaa; font-family: 'Courier New', monospace;
      font-size: 16px; font-weight: bold; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: -8px;
    }
    #npc-ok-btn {
      background: #333; color: #fff; border: 1px solid #555;
      border-radius: 6px; padding: 8px 32px;
      font-family: 'Courier New', monospace; font-size: 14px;
      cursor: pointer; pointer-events: auto; transition: background 0.2s;
      align-self: center;
    }
    #npc-ok-btn:hover { background: #444; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="reticle"></div>
    <div id="context-text"></div>
    <div id="message" class="message"></div>
    <div id="dizzy-overlay"></div>
    <div id="tutorial">wasd para moverte / mouse para mirar</div>
    <div id="timer">5:00</div>
    <div id="gameover">
      <div id="gameover-text">GAME OVER</div>
    </div>
    <div id="win-overlay">
      <div id="win-text">bien wn, ganaste</div>
    </div>
    <div id="npc-dialog">
      <div id="npc-dialog-bg"></div>
      <div id="npc-dialog-box">
        <img id="npc-portrait" src="/gon2.png" alt="" />
        <div id="npc-content">
          <div id="npc-name"></div>
          <p id="npc-text"></p>
          <button id="npc-ok-btn">[F] para continuar</button>
        </div>
      </div>
    </div>
  </div>
  <div id="cover">
    <div id="cover-bg"></div>
    <button id="cover-btn">Comenzar</button>
  </div>
  <button id="touch-interact">F</button>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
